<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Намери град или село в България, което пасва на начина, по който искаш да живееш. Открий място, опитай живота там и планирай преместването."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="nakade" />
    <meta property="og:title" content="nakade — къде животът ти може да е по-добър" />
    <meta
      property="og:description"
      content="Открий своето място в България с реални данни: училища, лекари, транспорт, работа, природа."
    />
    <meta property="og:url" content="https://nakade.app/" />
    <meta property="og:image" content="https://nakade.app/brand/nakade-logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="color-scheme" content="light dark" />
    <title>nakade</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the stored theme before first paint (avoids a light flash in dark mode).
      try {
        var t = JSON.parse(localStorage.getItem('nakade.theme') || '{}').state?.theme || 'system'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
