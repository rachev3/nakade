openapi: 3.1.0
info:
  title: nakade API (frontend draft)
  version: 0.1.0-draft
  description: |
    DRAFT written by the frontend so it can build against mocks (MSW) before the backend exists.
    It follows the sketch in docs/proposals/backend.md. The backend team owns the real contract:
    once they publish their own openapi.json, it replaces this file and the frontend regenerates
    `schema.d.ts` from it (`pnpm --filter @nakade/web api:types`).

    Conventions
    - Settlements are identified by their EKATTE code everywhere (DB, API, URLs).
    - Every fact carries provenance (source, retrieved_at, status). `value: null` means
      "no reliable data" and must never be filled with a guess.
    - Free text (hooks, simulation, plan) is localised by the `Accept-Language` header (bg | en).
servers:
  - url: /
paths:
  /api/session:
    post:
      operationId: createSession
      summary: Create or resume the anonymous session (cookie)
      responses:
        '200':
          description: Existing or new session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
    delete:
      operationId: deleteSession
      summary: Delete the session and everything in it (profile, answers, likes); expires the cookie
      responses:
        '204':
          description: Deleted (also when there was nothing to delete)
  /api/profile:
    get:
      operationId: getProfile
      responses:
        '200':
          description: Profile of the current session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
    patch:
      operationId: patchProfile
      summary: Merge partial answers (progressive profiling). Never resets existing answers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePatch' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
  /api/settlements:
    get:
      operationId: listSettlements
      parameters:
        - name: type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SettlementType' }
      responses:
        '200':
          description: All settlements in scope
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SettlementSummary' }
  /api/settlements/{ekatte}:
    get:
      operationId: getSettlement
      parameters:
        - $ref: '#/components/parameters/Ekatte'
      responses:
        '200':
          description: Settlement with facts and nearby places
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settlement' }
        '404':
          description: Unknown EKATTE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/matches:
    post:
      operationId: getMatches
      summary: Ranked matches for the current profile (deterministic scoring)
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatchRequest' }
      responses:
        '200':
          description: Ranked matches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Match' }
  /api/swipes:
    post:
      operationId: recordSwipe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Swipe' }
      responses:
        '204':
          description: Recorded
  /api/saved:
    get:
      operationId: listSaved
      responses:
        '200':
          description: Liked and saved places of the current session
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedPlace' }
  /api/settlements/{ekatte}/simulation:
    post:
      operationId: getSimulation
      parameters:
        - $ref: '#/components/parameters/Ekatte'
      responses:
        '200':
          description: A day in the place for the current profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Simulation' }
  /api/settlements/{ekatte}/plan:
    post:
      operationId: getPlan
      parameters:
        - $ref: '#/components/parameters/Ekatte'
      responses:
        '200':
          description: Personalised relocation plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelocationPlan' }

components:
  parameters:
    Ekatte:
      name: ekatte
      in: path
      required: true
      description: EKATTE code (5 digits)
      schema: { type: string, pattern: '^[0-9]{5}$' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    Session:
      type: object
      required: [session_id, created_at]
      properties:
        session_id: { type: string }
        created_at: { type: string, format: date-time }

    Dimension:
      type: string
      enum: [transport, healthcare, education, amenities, nature, employment, demographics]

    FactStatus:
      type: string
      description: |
        verified = taken from a source as-is; derived = calculated from sources (see `method`);
        estimated = an estimate, must never be styled like a verified number.
      enum: [verified, derived, estimated]

    Source:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: [string, 'null'], format: uri }
        licence: { type: [string, 'null'] }

    Fact:
      type: object
      required: [id, ekatte, dimension, metric, value, unit, status, source, retrieved_at]
      properties:
        id: { type: string }
        ekatte: { type: string }
        dimension: { $ref: '#/components/schemas/Dimension' }
        metric: { type: string, description: 'Stable metric key, e.g. drive_min_to_hospital' }
        value:
          description: '`null` = no reliable data'
          oneOf:
            - { type: number }
            - { type: string }
            - { type: 'null' }
        unit: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/FactStatus' }
        method:
          { type: [string, 'null'], description: 'How a derived/estimated value was produced' }
        source: { $ref: '#/components/schemas/Source' }
        retrieved_at: { type: string, format: date }

    SettlementType:
      type: string
      enum: [town, village]

    SettlementSummary:
      type: object
      required: [ekatte, name_bg, name_en, type, municipality, district, lat, lon, hook]
      properties:
        ekatte: { type: string }
        name_bg: { type: string }
        name_en: { type: string }
        type: { $ref: '#/components/schemas/SettlementType' }
        municipality: { type: string }
        district: { type: string }
        lat: { type: number }
        lon: { type: number }
        parent_town_ekatte: { type: [string, 'null'] }
        population: { type: [integer, 'null'] }
        hook: { type: string, description: 'Short swipe-card copy, localised' }
        image_url: { type: [string, 'null'] }

    NearbyPlace:
      type: object
      required: [settlement, drive_min]
      properties:
        settlement: { $ref: '#/components/schemas/SettlementSummary' }
        drive_min: { type: [number, 'null'] }

    Settlement:
      allOf:
        - $ref: '#/components/schemas/SettlementSummary'
        - type: object
          required: [facts, nearby]
          properties:
            facts:
              type: array
              items: { $ref: '#/components/schemas/Fact' }
            nearby:
              type: array
              items: { $ref: '#/components/schemas/NearbyPlace' }

    Household:
      type: string
      enum: [single, couple, family_kids, retired, other]
    WorkMode:
      type: string
      enum: [remote, hybrid, office, self_employed, looking, not_working]

    ProfileAnswers:
      type: object
      description: |
        Quick Match answers first, Detailed Match answers after. All optional: the profile is
        built progressively and partial updates are merged.
      properties:
        # journey context
        current_location: { type: [string, 'null'], description: EKATTE }
        destination: { type: [string, 'null'], description: 'EKATTE (journey A)' }
        lifestyle_text: { type: [string, 'null'] }
        lifestyle_chips: { type: array, items: { type: string } }
        # quick
        household: { $ref: '#/components/schemas/Household' }
        work_mode: { $ref: '#/components/schemas/WorkMode' }
        has_car: { type: boolean }
        priorities:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Dimension' }
        must_haves:
          type: array
          items:
            type: string
            enum: [hospital_30min, school, train_to_sofia, fast_internet, pharmacy, kindergarten]
        # detailed
        housing: { type: string, enum: [rent, buy, undecided] }
        budget_eur_month: { type: [integer, 'null'] }
        max_commute_min: { type: [integer, 'null'] }
        kids_ages: { type: array, items: { type: integer } }
        healthcare_needs: { type: string, enum: [none, regular, specialist] }
        amenities: { type: array, items: { type: string } }
        nature:
          { type: array, items: { type: string, enum: [mountains, forest, water, sea, plains] } }
        community: { type: string, enum: [quiet, lively, either] }
        connections:
          { type: [string, 'null'], description: 'Places with important people (free text)' }
        compromises: { type: array, items: { $ref: '#/components/schemas/Dimension' } }
        # added with the 10 (quick) / 30 (detailed) question onboarding
        max_home_distance:
          type: string
          enum: [up_to_1h, up_to_2h, up_to_4h, any]
          description: 'Hard limit on drive time to current_location'
        place_type: { type: string, enum: [village, small_town, city, any] }
        buy_budget_eur: { type: [integer, 'null'], description: 'Total budget when housing = buy' }
        home_type: { type: string, enum: [house, apartment, either] }
        office_days: { type: [integer, 'null'], minimum: 0, maximum: 5 }
        internet_needs: { type: string, enum: [basic, video_calls, heavy] }
        partner_job: { type: boolean }
        walkable: { type: boolean }
        public_transport: { type: string, enum: [daily, sometimes, never] }
        sofia_trips: { type: string, enum: [weekly, monthly, rarely] }
        visit_home: { type: string, enum: [weekly, monthly, rarely] }
        cold_tolerance: { type: string, enum: [love_winter, fine, prefer_mild] }
        heating_costs: { type: boolean }
        going_out: { type: string, enum: [often, sometimes, rarely] }
        pets: { type: boolean }
        depopulation: { type: string, enum: [important, somewhat, not_important] }

    Completeness:
      type: string
      enum: [none, quick, detailed]

    Profile:
      type: object
      required: [completeness, answers, updated_at]
      properties:
        completeness: { $ref: '#/components/schemas/Completeness' }
        answers: { $ref: '#/components/schemas/ProfileAnswers' }
        updated_at: { type: string, format: date-time }

    ProfilePatch:
      type: object
      properties:
        answers: { $ref: '#/components/schemas/ProfileAnswers' }
        completeness:
          description: 'Can only move forward (none → quick → detailed)'
          $ref: '#/components/schemas/Completeness'

    MatchRequest:
      type: object
      properties:
        ekatte:
          type: array
          description: Only score these settlements (place detail, compare)
          items: { type: string }
        type: { $ref: '#/components/schemas/SettlementType' }
        exclude_swiped: { type: boolean, default: false }
        limit: { type: integer, default: 20 }

    DimensionScore:
      type: object
      required: [key, score, weight, evidence]
      properties:
        key: { $ref: '#/components/schemas/Dimension' }
        score:
          {
            type: [number, 'null'],
            minimum: 0,
            maximum: 1,
            description: '`null` = not enough data',
          }
        weight: { type: number, minimum: 0, maximum: 1 }
        evidence: { type: array, items: { type: string }, description: Fact IDs }

    Explanation:
      type: object
      required: [text_key, fact_ids]
      properties:
        text_key: { type: string, description: 'i18n key rendered by the frontend' }
        params: { type: object, additionalProperties: { type: [string, number] } }
        fact_ids: { type: array, items: { type: string } }

    Unknown:
      type: object
      required: [dimension, missing]
      properties:
        dimension: { $ref: '#/components/schemas/Dimension' }
        missing:
          { type: array, items: { type: string }, description: Metric keys without reliable data }

    Match:
      type: object
      required:
        [
          ekatte,
          settlement,
          score,
          confidence,
          passes_constraints,
          dimensions,
          reasons,
          tradeoffs,
          unknowns,
        ]
      properties:
        ekatte: { type: string }
        settlement: { $ref: '#/components/schemas/SettlementSummary' }
        score: { type: number, minimum: 0, maximum: 1 }
        confidence: { type: number, minimum: 0, maximum: 1, description: 'Lowered by missing data' }
        passes_constraints: { type: boolean }
        excluded_because: { type: array, items: { $ref: '#/components/schemas/Explanation' } }
        dimensions: { type: array, items: { $ref: '#/components/schemas/DimensionScore' } }
        reasons: { type: array, items: { $ref: '#/components/schemas/Explanation' } }
        tradeoffs: { type: array, items: { $ref: '#/components/schemas/Explanation' } }
        unknowns: { type: array, items: { $ref: '#/components/schemas/Unknown' } }

    SwipeAction:
      type: string
      enum: [like, dislike, save]

    Swipe:
      type: object
      required: [ekatte, action]
      properties:
        ekatte: { type: string }
        action: { $ref: '#/components/schemas/SwipeAction' }

    SavedPlace:
      type: object
      required: [settlement, action, created_at]
      properties:
        settlement: { $ref: '#/components/schemas/SettlementSummary' }
        action: { type: string, enum: [like, save] }
        created_at: { type: string, format: date-time }

    StatementKind:
      type: string
      enum: [fact, scenario]

    Statement:
      type: object
      required: [kind, text, fact_ids]
      properties:
        kind: { $ref: '#/components/schemas/StatementKind' }
        text: { type: string }
        fact_ids:
          type: array
          description: Required (non-empty) when kind = fact
          items: { type: string }

    Scene:
      type: object
      required: [id, time, title, statements]
      properties:
        id: { type: string }
        time: { type: string, description: 'Local time label, e.g. 07:30' }
        title: { type: string }
        statements: { type: array, items: { $ref: '#/components/schemas/Statement' } }

    Simulation:
      type: object
      required: [ekatte, scenes, facts]
      properties:
        ekatte: { type: string }
        scenes: { type: array, items: { $ref: '#/components/schemas/Scene' } }
        facts:
          type: array
          description: The facts bundle the scenes cite
          items: { $ref: '#/components/schemas/Fact' }

    PlanItem:
      type: object
      required: [id, text, fact_ids]
      properties:
        id: { type: string }
        text: { type: string }
        fact_ids: { type: array, items: { type: string } }

    PlanSection:
      type: object
      required: [key, items]
      properties:
        key:
          type: string
          enum: [housing, employment, healthcare, education, transport, admin, community]
        items: { type: array, items: { $ref: '#/components/schemas/PlanItem' } }

    RelocationPlan:
      type: object
      required: [ekatte, sections]
      properties:
        ekatte: { type: string }
        sections: { type: array, items: { $ref: '#/components/schemas/PlanSection' } }
